<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOMESETS — Wireframe: Workout Player (Active Set)</title>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const w = params.get('w');
      if (w) {
        document.documentElement.style.setProperty('--device-width', w + 'px');
      }
      if (params.get('scale') === '1.5') {
        document.documentElement.classList.add('text-scale-150');
      }
    })();
  </script>
  <style>
    :root {
      --bg-dark: #121316;
      --card-bg: #1c1e24;
      --card-border: #2a2d36;
      --accent-lime: #ccff00;
      --accent-lime-dim: #99cc00;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-tertiary: #8e8e93;
      --danger-text: #ef4444;
      --danger-bg: #dc2626;
      --device-width: 390px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
    }
    html {
      font-size: 16px;
    }
    html.text-scale-150 {
      font-size: 24px;
    }
    html, body {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--device-width);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }
    .device-shell {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .top-bar {
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f222a;
    }
    .exercise-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .btn-icon-pause {
      background: #27272a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .player-content {
      flex: 1;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }
    .exercise-hero {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .exercise-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }
    .equipment-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #27272a;
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      align-self: flex-start;
      flex-wrap: wrap;
    }
    .equipment-badge strong {
      color: var(--accent-lime);
    }
    .form-cue-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .form-cue-box strong {
      color: #ffffff;
    }
    .set-chips {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .set-chip {
      flex: 1;
      height: 40px;
      background: #1c1e24;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .set-chip.active {
      background: rgba(204, 255, 0, 0.15);
      border-color: var(--accent-lime);
      color: var(--accent-lime);
      font-weight: 800;
    }
    .set-chip.done {
      background: #27272a;
      color: #ffffff;
    }
    /* Thumb Control Dock */
    .thumb-control-dock {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 8px;
    }
    .rep-stepper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 16px;
    }
    .stepper-btn {
      width: 52px;
      height: 52px;
      background: #27272a;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stepper-display {
      text-align: center;
    }
    .stepper-val {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--accent-lime);
      line-height: 1;
    }
    .stepper-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .btn-log-set {
      width: 100%;
      height: 56px;
      background: var(--accent-lime);
      color: #0b0c0e;
      border: none;
      border-radius: 18px;
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(204, 255, 0, 0.2);
    }
    .quick-actions {
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      flex: 1;
      height: 48px;
      background: #1c1e24;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 14px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-pain {
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--danger-text);
      background: rgba(239, 68, 68, 0.08);
    }
  </style>
</head>
<body>

  <div class="device-shell">
    <!-- Android Status Bar -->
    <div class="status-bar">
      <span>📶 🔋 100%</span>
      <span>3:42 PM</span>
    </div>

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="exercise-counter">التمرين 1 من 3 • سحب وضهر</div>
      <button class="btn-icon-pause" aria-label="إيقاف مؤقت">⏸</button>
    </header>

    <!-- Workout Player Body -->
    <main class="player-content">
      <div class="exercise-hero">
        <h1 class="exercise-title">عقلة قبضة واسعة<br>(Wide Grip Pull-ups)</h1>
        <div class="equipment-badge">
          <span>المساعدة:</span>
          <strong>حبل أسود سميك (مساعدة وزن)</strong>
        </div>

        <div class="form-cue-box">
          💡 <strong>توجيه الأداء:</strong> اسحب كوعك لورا لتحت، اثبت ثانية عند الصدر، وانزل ببطء كامل في ثانيتين بدون مرجحة.
        </div>

        <!-- Sets indicator -->
        <div class="set-chips">
          <div class="set-chip active">المجموعة 1 (الحالية)</div>
          <div class="set-chip">المجموعة 2</div>
          <div class="set-chip">المجموعة 3</div>
        </div>
      </div>

      <!-- Lower Thumb Zone Dock -->
      <div class="thumb-control-dock">
        <!-- Rep Stepper -->
        <div class="rep-stepper">
          <button class="stepper-btn" aria-label="تقليل تكرار">-</button>
          <div class="stepper-display">
            <div class="stepper-val">10</div>
            <div class="stepper-label">تكرارات محققة (الهدف: 8-10)</div>
          </div>
          <button class="stepper-btn" aria-label="زيادة تكرار">+</button>
        </div>

        <!-- Primary Log Set CTA (56dp) -->
        <button class="btn-log-set" aria-label="تسجيل المجموعة">
          ✓ تسجيل المجموعة وبدء الراحة
        </button>

        <!-- Secondary in-set actions -->
        <div class="quick-actions">
          <button class="btn-secondary">🔄 تبديل التمرين</button>
          <button class="btn-secondary btn-pain">🛑 ألم في المفصل (إيقاف فوري)</button>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
