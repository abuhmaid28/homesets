<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOMESETS — Wireframe: Rest Timer State</title>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const w = params.get('w');
      if (w) {
        document.documentElement.style.setProperty('--device-width', w + 'px');
      }
      if (params.get('scale') === '1.5') {
        document.documentElement.classList.add('text-scale-150');
      }
    })();
  </script>
  <style>
    :root {
      --bg-dark: #121316;
      --card-bg: #1c1e24;
      --card-border: #2a2d36;
      --accent-lime: #ccff00;
      --accent-lime-dim: #99cc00;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-tertiary: #8e8e93;
      --device-width: 390px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
    }
    html {
      font-size: 16px;
    }
    html.text-scale-150 {
      font-size: 24px;
    }
    html, body {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--device-width);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }
    .device-shell {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .top-bar {
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f222a;
    }
    .rest-header-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .rest-content {
      flex: 1;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      gap: 14px;
    }
    /* Circular Timer */
    .timer-container {
      width: 180px;
      height: 180px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .timer-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .timer-track {
      fill: none;
      stroke: #252830;
      stroke-width: 8;
    }
    .timer-bar {
      fill: none;
      stroke: var(--accent-lime);
      stroke-width: 8;
      stroke-dasharray: 565;
      stroke-dashoffset: 170;
      stroke-linecap: round;
    }
    .timer-center {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .timer-clock {
      font-size: 2.8rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }
    .timer-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    /* Next Set Preview Card */
    .next-set-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 16px;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .next-set-label {
      font-size: 0.75rem;
      color: var(--accent-lime);
      font-weight: 700;
    }
    .next-set-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }
    .next-set-sub {
      font-size: 0.65rem;
      color: var(--text-tertiary);
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .next-set-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    /* Exertion Feedback Section */
    .feedback-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .feedback-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .feedback-pills {
      display: flex;
      gap: 8px;
    }
    .btn-feedback {
      flex: 1;
      height: 46px;
      background: #27272a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .btn-feedback.selected {
      background: rgba(204, 255, 0, 0.15);
      border-color: var(--accent-lime);
      color: var(--accent-lime);
      font-weight: 800;
    }
    /* Bottom Controls */
    .rest-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-skip {
      width: 100%;
      height: 54px;
      background: var(--accent-lime);
      color: #0b0c0e;
      border: none;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-add-time {
      width: 100%;
      height: 46px;
      background: #27272a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="device-shell">
    <!-- Android Status Bar -->
    <div class="status-bar">
      <span>📶 🔋 100%</span>
      <span>3:43 PM</span>
    </div>

    <!-- Header -->
    <header class="top-bar">
      <div class="rest-header-title">استراحة استرجاع الطاقة • التمرين 1 من 3</div>
      <div style="font-size:0.75rem; color:var(--text-muted);">تم إنهاء: 1/3</div>
    </header>

    <!-- Content -->
    <main class="rest-content">
      <!-- Circular Timer -->
      <div class="timer-container">
        <svg class="timer-svg" viewBox="0 0 100 100">
          <circle class="timer-track" cx="50" cy="50" r="42" />
          <circle class="timer-bar" cx="50" cy="50" r="42" />
        </svg>
        <div class="timer-center">
          <div class="timer-clock">01:14</div>
          <div class="timer-sub">ثانية متبقية</div>
        </div>
      </div>

      <!-- Exertion Feedback Pills (Natural Egyptian Arabic) -->
      <div class="feedback-section">
        <div class="feedback-title">كيف شعرت بصعوبة المجموعة السابقة؟</div>
        <div class="feedback-pills">
          <button class="btn-feedback">فاضل طاقة 💪</button>
          <button class="btn-feedback selected">مظبوط ومثالي 👍</button>
          <button class="btn-feedback">على الآخر (صعب)</button>
        </div>
      </div>

      <!-- Next Set Preview -->
      <div class="next-set-card">
        <div class="next-set-label">المجموعة القادمة (المجموعة 2 من 3)</div>
        <div class="next-set-title">عقلة قبضة واسعة</div>
        <div dir="ltr" class="next-set-sub">WIDE-GRIP PULL-UPS</div>
        <div class="next-set-meta">الهدف: 8-10 تكرارات • حبل أسود مساعدة وزن الجسم</div>
      </div>

      <!-- Bottom Rest Actions -->
      <div class="rest-actions">
        <button class="btn-skip" aria-label="جاهز للمجموعة القادمة">
          جاهز! ابدأ المجموعة القادمة ←
        </button>
        <button class="btn-add-time" aria-label="زيادة 30 ثانية">
          ⏱️ إضافة 30 ثانية راحة إضافية
        </button>
      </div>
    </main>
  </div>

</body>
</html>
