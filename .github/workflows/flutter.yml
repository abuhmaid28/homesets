name: HOMESETS Flutter Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [campaign/c3-flutter-core, main]

permissions:
  contents: read

concurrency:
  group: homesets-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-checks:
    name: Foundation and security hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline foundation fixtures and hygiene
        run: python tools/quality/run_all_checks.py

  flutter-quality-and-build:
    name: Flutter analyze, test, and APK build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Verify environment
        run: flutter --version
      - name: Fetch locked pub dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --no-pub
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      - name: Check main (release-oriented) manifest has no INTERNET
        run: |
          if grep -qi 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo 'ERROR: INTERNET permission in production main manifest'
            exit 1
          fi
          echo 'PASS: No INTERNET permission in main manifest (NOT proof about debug or merged APK permissions)'
      - name: Preserve APK build evidence
        uses: actions/upload-artifact@v4
        with:
          name: homesets-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
