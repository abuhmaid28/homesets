name: HOMESETS Real Flutter CI (P0-P4 Implementation)

on:
  pull_request:
    branches:
      - main
      - campaign/c3-flutter-core
  push:
    branches:
      - main
      - campaign/c3-flutter-core

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-checks:
    name: Docs, Fixtures & Security Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Master Quality Suite (Fixtures, Links, Hygiene)
        run: python tools/quality/run_all_checks.py

  flutter-quality-and-build:
    name: Flutter Analyze, Test & Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Zero Static Analysis Errors or Warnings
        run: flutter analyze --no-fatal-infos

      - name: Run Full Flutter Test Suite
        run: flutter test --no-pub

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Verify Zero INTERNET Permission in AndroidManifest
        run: |
          if grep -i "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "[CRITICAL SECURITY FAILURE] INTERNET permission found in AndroidManifest.xml!"
            exit 1
          fi
          echo "[SECURITY PASS] Offline security verified. Zero INTERNET permission present."
